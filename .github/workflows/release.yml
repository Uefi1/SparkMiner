name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    name: build esp32-c6-supermini
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build esp32-c6-supermini
        run: pio run -e esp32-c6-supermini
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-c6-supermini
          path: |
            firmware/**/*esp32-c6-supermini*.bin
            .pio/build/esp32-c6-supermini/*.bin
          if-no-files-found: error

  release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: artifacts/**/*.bin
