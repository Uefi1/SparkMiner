name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build esp32-c6-supermini
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build esp32-c6-supermini
        run: pio run -e esp32-c6-supermini

      - name: Collect firmware + factory
        run: |
          OUT=firmware/esp32-c6-supermini
          mkdir -p "$OUT"

          # post_build_merge.py пишет в firmware/dev/ (нет git-тегов)
          if [ -f firmware/dev/esp32-c6-supermini_factory.bin ]; then
            cp firmware/dev/esp32-c6-supermini_factory.bin  "$OUT/"
            cp firmware/dev/esp32-c6-supermini_firmware.bin "$OUT/"
          elif [ -f .pio/build/esp32-c6-supermini/firmware.factory.bin ]; then
            # fallback: то, что делает сам PlatformIO
            cp .pio/build/esp32-c6-supermini/firmware.factory.bin \
               "$OUT/esp32-c6-supermini_factory.bin"
            cp .pio/build/esp32-c6-supermini/firmware.bin \
               "$OUT/esp32-c6-supermini_firmware.bin"
          else
            echo "ERROR: no factory bin found"
            find .pio/build/esp32-c6-supermini firmware -name '*.bin' 2>/dev/null || true
            exit 1
          fi

          ls -la "$OUT"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-c6-supermini
          path: firmware/esp32-c6-supermini/*.bin
          if-no-files-found: error
          retention-days: 14
          
