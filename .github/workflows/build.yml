name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build esp32-c6-supermini
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build esp32-c6-supermini
        run: pio run -e esp32-c6-supermini

      - name: Create factory.bin (bootloader + partitions + app)
        run: |
          BUILD=.pio/build/esp32-c6-supermini
          OUT=firmware/esp32-c6-supermini
          mkdir -p "$OUT"

          # firmware-only (OTA / update)
          cp "$BUILD/firmware.bin" "$OUT/esp32-c6-supermini_firmware.bin"

          # factory (full flash image at 0x0) — ESP32-C6 layout
          python -m esptool --chip esp32c6 merge-bin \
            -o "$OUT/esp32-c6-supermini_factory.bin" \
            --flash-mode dio \
            --flash-freq 80m \
            --flash-size 4MB \
            0x0    "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0x10000 "$BUILD/firmware.bin"

          ls -la "$OUT"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-c6-supermini
          path: firmware/esp32-c6-supermini/*.bin
          if-no-files-found: error
          retention-days: 14
