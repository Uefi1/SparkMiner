name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build esp32-c6-supermini
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build esp32-c6-supermini
        run: pio run -e esp32-c6-supermini
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-c6-supermini
          path: |
            firmware/**/*esp32-c6-supermini*.bin
            .pio/build/esp32-c6-supermini/*.bin
          if-no-files-found: warn
          retention-days: 14
